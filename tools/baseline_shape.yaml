# Baseline 采集配置（方案B：每个算子自包含声明 native 调用 + shape + 输入构造）
#
# 仅收录 benchmark/ 里【确实调用 NV 原生 kernel】的算子；纯 torch 参考的
# 算子（如 silu_and_mul、add_rms_norm 的 torch_op 都是 torch 组合，无原生
# kernel）不在此列。逐步添加。
#
# 每个算子字段：
#   native.module / native.symbol : NV 原生 callable 的解析坐标，交给
#       collect_baseline_nvidia.resolve_native_op(module, symbol) 解析：
#       族A  torch.ops._C / torch.ops._moe_C.<symbol>
#       族B  vllm._custom_ops.<symbol>
#       族C  vllm 内部 kernel 模块.<symbol>
#   dtypes : 遍历的数据类型（字符串，形如 torch.bfloat16）。
#   grid   : 基准维度取值；对各维度做笛卡尔积，每个组合是一个采集点。
#   inputs : 按位置构造 native 调用实参（op(*inputs)）。每项二选一：
#       {tensor: [<dim名 或 int 或 "2*dim">, ...], dtype: <可选>, fill: <可选>,
#                low/high: <randint 用>}
#           tensor : 形状，维度支持「dim名 / int / "系数*dim名"」。
#           dtype  : 该张量 dtype（缺省用算子的 dtypes 遍历值）；标签算子里
#                    索引/长度类张量常固定为 torch.int32、bias 常为 torch.float32。
#           fill   : randn(默认) / rand / zeros / empty / randint。
#           low,high: fill=randint 时的取值区间 [low, high)。
#       {scalar: <值>}                              直接作为标量传入（含 bool）
#   key_dims : 可选，用作 JSON 主键(对应 benchmark 的 shape)的维度列表；
#       缺省取第一个 tensor 输入的 shape。

fused_add_rms_norm:
  # torch.ops._C.fused_add_rms_norm(input, residual, weight, eps)
  # input/residual 原地写回，无返回值。见 benchmark/test_fused_add_rms_norm.py。
  native:
    module: vllm._custom_ops
    symbol: fused_add_rms_norm
  dtypes: [torch.bfloat16, torch.float16]
  grid:
    M: [1, 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024, 2048, 4096, 8192]
    N: [256, 512]
  inputs:
    - {tensor: [M, N]}    # input   （原地写回）
    - {tensor: [M, N]}    # residual（原地写回）
    - {tensor: [N]}       # weight
    - {scalar: 1.0e-5}    # eps
  key_dims: [M, N]

grouped_topk:
  # torch.ops._moe_C.grouped_topk(scores, n_group, topk_group, topk,
  #     renormalize, routed_scaling_factor, bias, scoring_func)
  # 见 benchmark/test_grouped_topk.py（Deepseek-3.2 配置，非 renorm 分支）。
  # scores 遍历 dtype；bias 固定 fp32；后面全是标量常量。
  native:
    module: torch.ops._moe_C
    symbol: grouped_topk
  dtypes: [torch.bfloat16, torch.float16]
  grid:
    # num_experts/n_group/topk_group/topk 固定，仅 num_tokens 变化。
    T: [1, 8, 32, 64, 128, 256, 496, 512, 16384]
    E: [256]
  inputs:
    - {tensor: [T, E]}                    # scores（遍历 dtype）
    - {scalar: 8}                         # n_group
    - {scalar: 4}                         # topk_group
    - {scalar: 8}                         # topk
    - {scalar: true}                      # renormalize
    - {scalar: 1.0}                       # routed_scaling_factor
    - {tensor: [E], dtype: torch.float32} # bias
    - {scalar: 0}                         # scoring_func
  key_dims: [T, E]
